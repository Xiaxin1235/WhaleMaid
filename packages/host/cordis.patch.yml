- insert:
    - id: whaledot
      name: 'dsh-whaledot'
    # The companion "大肥鱼": an agent preset whose sessions get a persona and read-only WhaleDot
    # tools, and nothing else (no file, shell, web or subagent tools). WhaleDot creates one long-lived
    # session with it; the WhaleDot tool gate additionally denies any other tool in that session.
    - id: preset-whaledot-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: whaledot-companion
        order: 50
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{whaledot_persona}}\n\n{{whaledot_memory}}\n\n{{whaledot_memory_guidance}}"
              complete: true
          - id: whaledot-companion
            name: 'dsh-whaledot/companion'
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
