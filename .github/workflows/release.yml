name: Verify the published WhaleMaid market update
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix .market-smoke --ignore-scripts --no-audit --no-fund dshmarket@1.73.21 dsh-plugin-catalog@2026.1119.23991
      - name: Resolve the update using the published marketplace client and catalog
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { catalogReleaseSourceOf, publishedReleaseUpdate } from './.market-smoke/node_modules/dshmarket/lib/release-updates.js';
          const payload = JSON.parse(readFileSync('.market-smoke/node_modules/dsh-plugin-catalog/plugins.json', 'utf8'));
          const catalog = Array.isArray(payload) ? payload : payload.plugins;
          const url = 'https://github.com/Xiaxin1235/WhaleMaid/tree/master/packages/host';
          const entry = catalog.find(item => item.url === url);
          assert.ok(entry);
          const target = 'https://github.com/Xiaxin1235/WhaleMaid/releases/download/v1.6.8/dsh-whalemaid-full.tgz';
          for (const prior of [entry.tarball, entry.tarball.replace('/latest/download/', '/download/v1.6.7/')]) {
            const source = catalogReleaseSourceOf(prior, entry);
            assert.ok(source);
            const update = await publishedReleaseUpdate(source, 'dsh-whalemaid');
            assert.deepEqual(update, { version: '1.6.8', target });
            console.log(prior + ' → ' + update.target);
          }
          JS
