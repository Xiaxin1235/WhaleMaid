name: Release complete WhaleMaid
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whalemaid-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.repository == 'Xiaxin1235/WhaleMaid'
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select and validate the package version
        run: >-
          node --input-type=module -e
          "import { readFileSync, appendFileSync } from 'node:fs';
          const tag = 'v' + JSON.parse(readFileSync('packages/host/package.json')).version;
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF_NAME !== tag) throw Error('Tag version mismatch');
          appendFileSync(process.env.GITHUB_ENV, 'RELEASE_TAG=' + tag + '\n');"
      - name: Verify the tag and the already published companion
        run: node scripts/verify-release-inputs.mjs
      - run: pnpm build
      - run: pnpm test:package
      - run: pnpm pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: whalemaid-complete
          path: |
            dist/release/dsh-whalemaid-full*.tgz
            dist/release/verification.json
            dist/release/SHA256SUMS
          if-no-files-found: error
  install:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        dsh: ['0.2.1-rc.2', '0.2.1-rc.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the official Ubuntu archive for graphical test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: pnpm exec playwright-core install --with-deps chromium
      - name: Start managed Linux display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout 300 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends xvfb openbox x11-utils libxtst6 python3
          Xvfb :99 -screen 0 1200x800x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for attempt in {1..100}; do if DISPLAY=:99 xdpyinfo > /dev/null 2>&1; then break; fi; sleep .1; done
          export DISPLAY=:99
          xdpyinfo > /dev/null
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          for attempt in {1..100}; do if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'; then break; fi; sleep .1; done
          xprop -root _NET_SUPPORTING_WM_CHECK | grep -q 'window id'
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: whalemaid-complete
          path: dist/release
      - run: npm install --prefix .dsh-dev/complete-runtime --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - run: node scripts/test-complete-install.mjs
        env:
          DSH_TEST_VERSION: ${{ matrix.dsh }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-install-${{ matrix.os }}-${{ matrix.dsh }}
          path: artifacts/
  install_macos:
    # Acquire one scarce GPU-capable ARM runner for both host versions.
    # The two installations still consume the identical canonical archive.
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: whalemaid-complete
          path: dist/release
      - run: npm install --prefix .dsh-dev/complete-runtime --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.2
      - id: rc2
        run: node scripts/test-complete-install.mjs
        env:
          DSH_TEST_VERSION: '0.2.1-rc.2'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-install-macos-15-0.2.1-rc.2
          path: artifacts/
      - run: npm install --prefix .dsh-dev/complete-runtime --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.3
      - id: rc3
        run: node scripts/test-complete-install.mjs
        env:
          DSH_TEST_VERSION: '0.2.1-rc.3'
      - uses: actions/upload-artifact@v4
        if: always() && (steps.rc3.outcome == 'success' || steps.rc3.outcome == 'failure')
        with:
          name: complete-install-macos-15-0.2.1-rc.3
          path: artifacts/
  publish:
    needs: [install, install_macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: whalemaid-complete
          path: dist/release
      - name: Publish tested files, immutable package branch and native market index
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/publish-market.mjs
