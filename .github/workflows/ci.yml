name: CI

on:
  push:
  pull_request:

jobs:
  check:
    # Scope authorization uses Windows paths; Windows is the validated host platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --maxWorkers=2
      - run: pnpm format:check
