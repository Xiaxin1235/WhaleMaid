name: CI

on:
  push:
    branches: [master, codex/market-release]
  pull_request:
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Use a canonical temporary directory
        # Runner TEMP can be an alias; authorization intentionally rejects aliased project roots.
        run: >-
          node --input-type=module -e
          "import { realpathSync, appendFileSync } from 'node:fs';
          const temp = realpathSync(process.env.RUNNER_TEMP);
          appendFileSync(process.env.GITHUB_ENV, 'TEMP=' + temp + '\nTMP=' + temp + '\nTMPDIR=' + temp + '\n');
          console.log('Test temporary directory:', temp);"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Inspect Windows process probe in the host and filtered environments
        if: runner.os == 'Windows'
        run: node scripts/check-windows-process-probe.mjs
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --maxWorkers=2
      - run: pnpm test:package
      - run: pnpm format:check
